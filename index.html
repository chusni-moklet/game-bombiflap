<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bombi - Hand Controlled</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- MediaPipe Libraries (Menggunakan CDN jsdelivr yang lebih stabil untuk WASM) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #87CEEB;
            /* Sky blue */
            font-family: 'Inter', sans-serif;
            touch-action: none;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Camera feed container for debugging/feedback */
        #camera-preview {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 200px;
            height: 150px;
            border-radius: 12px;
            overflow: hidden;
            border: 4px solid white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            z-index: 10;
            background-color: #333;
            transform: scaleX(-1);
            /* Mirror */
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #camera-preview.active {
            opacity: 1;
            pointer-events: auto;
        }

        #camera-preview canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
        }

        .hidden {
            display: none !important;
        }

        .btn {
            background: linear-gradient(145deg, #fbbf24, #d97706);
            border: 4px solid #b45309;
            color: white;
            text-shadow: 2px 2px 0 #78350f;
            transition: all 0.15s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .btn:active, .btn.hand-clicked {
            transform: scale(0.95) !important;
        }

        .btn:disabled {
            filter: grayscale(100%);
            cursor: not-allowed;
            opacity: 0.7;
        }

        .btn.hand-hover, .btn-restart.hand-hover, .btn-quit.hand-hover {
            transform: scale(1.06);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.8) !important;
            filter: brightness(1.1);
        }

        .btn-restart {
            background: linear-gradient(145deg, #10b981, #059669);
            border: 4px solid #047857;
            color: white;
            text-shadow: 2px 2px 0 #064e3b;
            transition: all 0.15s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .btn-quit {
            background: linear-gradient(145deg, #ef4444, #dc2626);
            border: 4px solid #b91c1c;
            color: white;
            text-shadow: 2px 2px 0 #7f1d1d;
            transition: all 0.15s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .dwell-progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 6px;
            width: 0%;
            background: #ffffff;
            opacity: 0.95;
            box-shadow: 0 0 8px white;
            transition: width 0.05s linear;
            z-index: 5;
        }

        /* Virtual Hand Cursor */
        #hand-cursor {
            position: fixed;
            width: 52px;
            height: 52px;
            margin-left: -26px;
            margin-top: -26px;
            pointer-events: none;
            z-index: 9999;
            will-change: transform;
            transition: opacity 0.2s ease;
        }

        .cursor-outer {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: rgba(37, 99, 235, 0.25);
            box-shadow: 0 0 18px rgba(59, 130, 246, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.6);
        }

        .cursor-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 14px;
            height: 14px;
            background: #2563eb;
            border: 2.5px solid white;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            transition: all 0.15s ease;
        }

        .cursor-progress-svg {
            position: absolute;
            inset: 0;
            transform: rotate(-90deg);
        }

        .cursor-progress-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 4;
        }

        .cursor-progress-fg {
            fill: none;
            stroke: #10b981;
            stroke-width: 4;
            stroke-dasharray: 138.2; /* 2 * PI * 22 */
            stroke-dashoffset: 138.2;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.05s linear;
        }

        #hand-cursor.pinching .cursor-center {
            background: #f59e0b;
            transform: translate(-50%, -50%) scale(1.4);
            box-shadow: 0 0 12px #f59e0b;
        }

        #score-board {
            position: absolute;
            top: 30px;
            width: 100%;
            text-align: center;
            font-size: 5rem;
            font-weight: 900;
            color: white;
            -webkit-text-stroke: 3px black;
            text-shadow: 4px 4px 0 #000;
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <!-- Game Area -->
    <canvas id="gameCanvas"></canvas>
    <div id="score-board">0</div>

    <!-- In-Game Stop Button -->
    <button id="in-game-stop-btn" class="hidden absolute top-5 left-5 z-10 px-5 py-2.5 bg-red-600 hover:bg-red-700 text-white font-extrabold rounded-2xl shadow-xl border-2 border-red-800 text-base uppercase transition-transform overflow-hidden cursor-pointer">
        <span class="relative z-10">🛑 Berhenti</span>
        <div class="dwell-progress-bar"></div>
    </button>

    <!-- Hidden working video element for MediaPipe stream (must not be display:none to avoid WebGL context failure) -->
    <video id="videoElement" playsinline autoplay muted
        style="position: fixed; top: -9999px; left: -9999px; width: 320px; height: 240px; opacity: 0; pointer-events: none; z-index: -999;"></video>

    <!-- Mini Camera Preview -->
    <div id="camera-preview">
        <canvas id="outputCanvas" width="320" height="240"></canvas>
    </div>

    <!-- Start / Loading Screen -->
    <div id="start-screen" class="overlay">
        <div class="bg-white rounded-3xl p-8 max-w-md text-center shadow-2xl border-8 border-yellow-400">
            <img src="bombi.png" alt="Bombi" class="w-32 h-32 mx-auto mb-2 object-contain drop-shadow-xl animate-pulse" />
            <h1 class="text-4xl font-black mb-2 text-red-600 uppercase tracking-wide">Flappy Bombi</h1>
            <p class="text-gray-700 mb-6 font-medium">Gunakan <b>jari telunjuk</b> Anda di depan kamera untuk
                menggerakkan <b>Bombi</b> terbang naik dan turun.</p>

            <div id="status-container" class="mb-4">
                <p id="status-text" class="text-sm font-bold text-blue-600 hidden">Menyiapkan...</p>
                <p id="error-text" class="text-sm font-bold text-red-600 hidden"></p>
            </div>

            <button id="start-btn" class="btn px-8 py-3 rounded-2xl text-2xl font-black uppercase w-full relative overflow-hidden">
                <span class="relative z-10">Mulai Game</span>
                <div class="dwell-progress-bar"></div>
            </button>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="overlay hidden">
        <div class="bg-white rounded-3xl p-8 max-w-lg text-center shadow-2xl border-8 border-red-500">
            <img src="bombi.png" alt="Bombi" class="w-24 h-24 mx-auto mb-1 object-contain drop-shadow-md" />
            <h1 class="text-5xl font-black mb-2 text-red-600 uppercase">Game Over</h1>
            <p class="text-gray-600 mb-1 font-medium text-xl">Skor Anda: <span id="final-score"
                    class="text-black font-black text-3xl">0</span></p>
            <p class="text-amber-600 mb-6 font-bold text-lg">🏆 Rekor Terbaik: <span id="best-score"
                    class="text-amber-700 font-black text-2xl">0</span></p>

            <div class="flex gap-4 justify-center items-center mt-2">
                <button id="restart-btn" class="btn-restart flex-1 py-4 px-3 rounded-2xl text-xl font-black uppercase shadow-lg relative overflow-hidden">
                    <span class="relative z-10 flex items-center justify-center gap-2">🔄 Main Lagi</span>
                    <div class="dwell-progress-bar"></div>
                </button>
                <button id="quit-btn" class="btn-quit flex-1 py-4 px-3 rounded-2xl text-xl font-black uppercase shadow-lg relative overflow-hidden">
                    <span class="relative z-10 flex items-center justify-center gap-2">🛑 Berhenti</span>
                    <div class="dwell-progress-bar"></div>
                </button>
            </div>

            <div class="mt-5 p-3.5 bg-gray-100 rounded-2xl border border-gray-300">
                <p class="text-xs sm:text-sm font-semibold text-gray-700 text-center leading-relaxed">
                    👆 Arahkan <b>jari telunjuk</b> ke tombol selama 1 detik (atau cubit jari) untuk memilih tanpa mouse!
                </p>
            </div>
        </div>
    </div>

    <!-- Virtual Hand Cursor -->
    <div id="hand-cursor" class="hidden">
        <div class="cursor-outer"></div>
        <div class="cursor-center"></div>
        <svg class="cursor-progress-svg" viewBox="0 0 52 52">
            <circle class="cursor-progress-bg" cx="26" cy="26" r="22"></circle>
            <circle class="cursor-progress-fg" cx="26" cy="26" r="22"></circle>
        </svg>
    </div>

    <script>
        // --- DOM Elements ---
        const gameCanvas = document.getElementById('gameCanvas');
        const ctx = gameCanvas.getContext('2d');
        const videoElement = document.getElementById('videoElement');
        const outputCanvas = document.getElementById('outputCanvas');
        const outputCtx = outputCanvas.getContext('2d');
        const cameraPreview = document.getElementById('camera-preview');

        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status-text');
        const errorText = document.getElementById('error-text');

        const gameOverScreen = document.getElementById('game-over-screen');
        const restartBtn = document.getElementById('restart-btn');
        const quitBtn = document.getElementById('quit-btn');
        const inGameStopBtn = document.getElementById('in-game-stop-btn');
        const handCursor = document.getElementById('hand-cursor');
        const scoreBoard = document.getElementById('score-board');
        const finalScore = document.getElementById('final-score');
        const bestScore = document.getElementById('best-score');

        // --- Game Variables ---
        let gameRunning = false;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('flappy_bombi_best') || '0', 10);
        let frameCount = 0;
        let pipes = [];
        let groundOffsetX = 0;

        // --- Bombi Character Asset & State ---
        const bombiImg = new Image();
        bombiImg.src = 'bombi.png';
        const BOMBI_WIDTH = 75;
        const BOMBI_HEIGHT = 67;
        const BIRD_X = window.innerWidth * 0.2;
        const BIRD_RADIUS = 24;
        let birdY = window.innerHeight / 2;
        let targetBirdY = window.innerHeight / 2;

        // --- Game Config ---
        const PIPE_WIDTH = 70;
        const PIPE_GAP = 250;
        const PIPE_SPEED = 4;
        const SPAWN_RATE = 100;

        // --- Virtual Hand Cursor & Dwell Interaction ---
        let handCursorX = window.innerWidth / 2;
        let handCursorY = window.innerHeight / 2;
        let activeHoveredButton = null;
        let dwellStartTime = null;
        const DWELL_DURATION_MS = 1000; // Hover 1 detik untuk klik otomatis
        let lastClickTime = 0;
        let audioContext = null;

        function playClickSound() {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.type = 'sine';
                osc.connect(gain);
                gain.connect(audioContext.destination);

                osc.frequency.setValueAtTime(520, audioContext.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioContext.currentTime + 0.12);

                gain.gain.setValueAtTime(0.3, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.12);

                osc.start();
                osc.stop(audioContext.currentTime + 0.12);
            } catch (e) {
                // Audio not allowed or failed
            }
        }

        function showHandCursor(x, y, isPinching) {
            if (!handCursor) return;
            handCursor.classList.remove('hidden');
            handCursor.style.transform = `translate3d(${x}px, ${y}px, 0)`;
            if (isPinching) {
                handCursor.classList.add('pinching');
            } else {
                handCursor.classList.remove('pinching');
            }
        }

        function hideHandCursor() {
            if (handCursor) handCursor.classList.add('hidden');
        }

        function setDwellProgress(progress) {
            if (!handCursor) return;
            const progressFg = handCursor.querySelector('.cursor-progress-fg');
            const circumference = 138.23; // 2 * PI * 22
            const offset = circumference * (1 - Math.max(0, Math.min(1, progress)));
            if (progressFg) progressFg.style.strokeDashoffset = offset;

            if (activeHoveredButton) {
                const bar = activeHoveredButton.querySelector('.dwell-progress-bar');
                if (bar) bar.style.width = (progress * 100) + '%';
            }
        }

        function resetDwell() {
            if (activeHoveredButton) {
                activeHoveredButton.classList.remove('hand-hover');
                const bar = activeHoveredButton.querySelector('.dwell-progress-bar');
                if (bar) bar.style.width = '0%';
                activeHoveredButton = null;
            }
            dwellStartTime = null;
            if (handCursor) {
                const progressFg = handCursor.querySelector('.cursor-progress-fg');
                if (progressFg) progressFg.style.strokeDashoffset = 138.23;
                handCursor.classList.remove('pinching');
            }
        }

        function triggerButtonClick(btn) {
            lastClickTime = performance.now();
            btn.classList.add('hand-clicked');
            setTimeout(() => btn.classList.remove('hand-clicked'), 220);

            playClickSound();
            resetDwell();
            btn.click();
        }

        function updateHandButtonInteraction(x, y, isPinching, buttons) {
            const now = performance.now();
            if (now - lastClickTime < 600) {
                resetDwell();
                return;
            }

            let foundButton = null;
            for (let btn of buttons) {
                if (!btn || btn.offsetParent === null) continue; // Tombol harus tampak di layar
                const rect = btn.getBoundingClientRect();
                if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
                    foundButton = btn;
                    break;
                }
            }

            if (foundButton) {
                if (activeHoveredButton !== foundButton) {
                    resetDwell();
                    activeHoveredButton = foundButton;
                    dwellStartTime = now;
                    foundButton.classList.add('hand-hover');
                }

                const elapsed = now - dwellStartTime;
                const progress = Math.min(1, elapsed / DWELL_DURATION_MS);
                setDwellProgress(progress);

                // Klik otomatis saat dwell 100% atau jika pengguna melakukan gerakan cubit (pinch)
                if (progress >= 1 || isPinching) {
                    triggerButtonClick(foundButton);
                }
            } else {
                resetDwell();
            }
        }

        // --- Resize Canvas ---
        function resizeCanvas() {
            gameCanvas.width = window.innerWidth;
            gameCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- MediaPipe & Camera Setup ---
        let hands;
        let camera;
        let isAiReady = false;

        function setStatus(msg, isError = false) {
            statusText.classList.add('hidden');
            errorText.classList.add('hidden');
            if (isError) {
                errorText.textContent = msg;
                errorText.classList.remove('hidden');
            } else {
                statusText.textContent = msg;
                statusText.classList.remove('hidden');
            }
        }

        async function initializeSystem() {
            if (isAiReady) {
                startGame();
                return;
            }

            startBtn.disabled = true;
            setStatus("Meminta izin kamera...");

            try {
                // Initialize MediaPipe Hands
                setStatus("Mengunduh model AI...");
                hands = new Hands({
                    locateFile: (file) => {
                        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                    }
                });

                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.6,
                    minTrackingConfidence: 0.6
                });

                hands.onResults(onHandResults);

                setStatus("Menginisialisasi model AI (tunggu sebentar)...");
                await hands.initialize(); // Tunggu AI siap sepenuhnya

                setStatus("Mengaktifkan kamera...");

                // Set up Camera utility to feed frames automatically
                camera = new Camera(videoElement, {
                    onFrame: async () => {
                        if (videoElement.readyState >= 2 && videoElement.videoWidth > 0) {
                            await hands.send({ image: videoElement });
                        }
                    },
                    width: 320,
                    height: 240,
                    facingMode: 'user'
                });

                await camera.start();

                // Set output canvas size
                outputCanvas.width = 320;
                outputCanvas.height = 240;

                setStatus("Selesai! Memulai game...");
                isAiReady = true;

                // Jeda sebentar sebelum game mulai agar UI tidak terlalu cepat hilang
                setTimeout(() => {
                    startGame();
                    startBtn.disabled = false;
                }, 500);

            } catch (error) {
                console.error("Initialization Error:", error);
                startBtn.disabled = false;

                if (error.name === 'NotAllowedError' || error.name === 'NotFoundError') {
                    setStatus("Error: Akses kamera ditolak atau webcam tidak ditemukan.", true);
                } else {
                    setStatus("Error: Gagal memuat WebGL / AI. Pastikan Hardware Acceleration aktif di browser.", true);
                }
            }
        }

        // Callback saat tangan terdeteksi
        function onHandResults(results) {
            outputCtx.save();
            outputCtx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);

            // Gambar feed kamera ke canvas mini
            outputCtx.drawImage(results.image, 0, 0, outputCanvas.width, outputCanvas.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                // Gambar kerangka tangan
                drawConnectors(outputCtx, landmarks, HAND_CONNECTIONS, { color: '#00FF00', lineWidth: 2 });
                drawLandmarks(outputCtx, landmarks, { color: '#FF0000', lineWidth: 1, radius: 2 });

                // Ambil Landmark 8 (Ujung Jari Telunjuk) & Landmark 4 (Jempol)
                const indexFinger = landmarks[8];
                const thumbTip = landmarks[4];

                // Comfort padding: tengah 70% frame webcam dipetakan ke 100% layar
                const normX = Math.min(1, Math.max(0, (1 - indexFinger.x - 0.15) / 0.7));
                const normY = Math.min(1, Math.max(0, (indexFinger.y - 0.15) / 0.7));

                const targetX = normX * window.innerWidth;
                const targetY = normY * window.innerHeight;

                // Smoothing posisi kursor virtual (lerp)
                handCursorX += (targetX - handCursorX) * 0.45;
                handCursorY += (targetY - handCursorY) * 0.45;

                // Deteksi gerakan cubit (pinch jempol & telunjuk)
                const pinchDist = Math.hypot(indexFinger.x - thumbTip.x, indexFinger.y - thumbTip.y);
                const isPinching = pinchDist < 0.065;

                if (gameRunning) {
                    hideHandCursor();

                    // Map posisi Y jari ke tinggi pergerakan burung
                    let mappedY = normY * (gameCanvas.height - 120);
                    targetBirdY = Math.max(BIRD_RADIUS + 10, Math.min(gameCanvas.height - 100 - BIRD_RADIUS, mappedY));

                    // Cek jika jari diarahkan ke tombol Berhenti saat game berlangsung
                    updateHandButtonInteraction(handCursorX, handCursorY, isPinching, [inGameStopBtn]);
                } else {
                    // Game Over atau Start Screen: Tampilkan kursor tangan untuk navigasi tombol
                    showHandCursor(handCursorX, handCursorY, isPinching);

                    const interactiveButtons = [];
                    if (!gameOverScreen.classList.contains('hidden')) {
                        interactiveButtons.push(restartBtn, quitBtn);
                    } else if (!startScreen.classList.contains('hidden') && isAiReady) {
                        interactiveButtons.push(startBtn);
                    }

                    updateHandButtonInteraction(handCursorX, handCursorY, isPinching, interactiveButtons);
                }
            } else {
                hideHandCursor();
                resetDwell();
            }

            outputCtx.restore();
        }

        // --- Game Logic ---
        class Pipe {
            constructor() {
                this.x = gameCanvas.width;
                const minH = 50;
                const maxH = Math.max(minH + 10, gameCanvas.height - PIPE_GAP - 120);
                this.topH = Math.floor(Math.random() * (maxH - minH + 1) + minH);
                this.passed = false;
            }

            draw() {
                ctx.fillStyle = '#73bf2e';
                ctx.strokeStyle = '#543847';
                ctx.lineWidth = 3;

                // Atas
                ctx.fillRect(this.x, 0, PIPE_WIDTH, this.topH);
                ctx.strokeRect(this.x, 0, PIPE_WIDTH, this.topH);
                ctx.fillRect(this.x - 5, this.topH - 30, PIPE_WIDTH + 10, 30);
                ctx.strokeRect(this.x - 5, this.topH - 30, PIPE_WIDTH + 10, 30);

                // Bawah
                const bottomY = this.topH + PIPE_GAP;
                const bottomH = gameCanvas.height - bottomY;
                ctx.fillRect(this.x, bottomY, PIPE_WIDTH, bottomH);
                ctx.strokeRect(this.x, bottomY, PIPE_WIDTH, bottomH);
                ctx.fillRect(this.x - 5, bottomY, PIPE_WIDTH + 10, 30);
                ctx.strokeRect(this.x - 5, bottomY, PIPE_WIDTH + 10, 30);
            }

            update() {
                this.x -= PIPE_SPEED;
            }
        }

        function drawBackground() {
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);

            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.beginPath();
            ctx.arc(gameCanvas.width * 0.3, 100, 40, 0, Math.PI * 2);
            ctx.arc(gameCanvas.width * 0.35, 100, 50, 0, Math.PI * 2);
            ctx.arc(gameCanvas.width * 0.4, 100, 40, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawGround() {
            const groundY = gameCanvas.height - 100;
            ctx.fillStyle = '#ded895';
            ctx.fillRect(0, groundY, gameCanvas.width, 100);
            ctx.fillStyle = '#73bf2e';
            ctx.fillRect(0, groundY, gameCanvas.width, 20);
            ctx.strokeStyle = '#543847';
            ctx.strokeRect(0, groundY, gameCanvas.width, 20);

            groundOffsetX = (groundOffsetX - PIPE_SPEED) % 40;
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            for (let i = groundOffsetX; i < gameCanvas.width; i += 40) {
                ctx.moveTo(i, groundY + 20);
                ctx.lineTo(i - 20, gameCanvas.height);
            }
            ctx.stroke();
        }

        function drawEnvironment() {
            drawBackground();
            drawGround();
        }

        function drawBird() {
            birdY += (targetBirdY - birdY) * 0.15; // Smooth gerak

            ctx.save();
            ctx.translate(BIRD_X, birdY);

            const diff = targetBirdY - birdY;
            const angle = Math.min(Math.max(diff * 0.025, -0.45), 0.45);
            ctx.rotate(angle);

            if (bombiImg.complete && bombiImg.naturalWidth > 0) {
                // Efek getaran jetpack saat meluncur
                const flameOffset = Math.sin(frameCount * 0.4) * 2;
                ctx.drawImage(
                    bombiImg,
                    -BOMBI_WIDTH * 0.48,
                    -BOMBI_HEIGHT * 0.5 + flameOffset * 0.3,
                    BOMBI_WIDTH,
                    BOMBI_HEIGHT
                );
            } else {
                // Fallback sementara jika gambar masih loading
                ctx.beginPath();
                ctx.arc(0, 0, BIRD_RADIUS, 0, Math.PI * 2);
                ctx.fillStyle = '#EF4444';
                ctx.fill();
            }

            ctx.restore();
        }

        function checkCollision() {
            const hitBox = 20; // Hitbox seimbang di sekitar badan Bombi

            if (birdY - hitBox <= 0 || birdY + hitBox >= gameCanvas.height - 100) {
                endGame();
                return;
            }

            for (let p of pipes) {
                const pLeft = p.x;
                const pRight = p.x + PIPE_WIDTH;
                const topPBottom = p.topH;
                const botPTop = p.topH + PIPE_GAP;

                if (BIRD_X + hitBox > pLeft && BIRD_X - hitBox < pRight) {
                    if (birdY - hitBox < topPBottom || birdY + hitBox > botPTop) {
                        endGame();
                        return;
                    }
                }

                if (pLeft + PIPE_WIDTH < BIRD_X && !p.passed) {
                    p.passed = true;
                    score++;
                    scoreBoard.textContent = score;
                }
            }
        }

        function gameLoop() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, gameCanvas.width, gameCanvas.height);
            drawBackground();

            if (frameCount % SPAWN_RATE === 0) pipes.push(new Pipe());

            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].update();
                pipes[i].draw();
                if (pipes[i].x + PIPE_WIDTH < 0) pipes.splice(i, 1);
            }

            drawGround();
            drawBird();
            checkCollision();

            frameCount++;
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            cameraPreview.classList.add('active');
            inGameStopBtn.classList.remove('hidden');

            resetDwell();
            hideHandCursor();

            score = 0;
            frameCount = 0;
            pipes = [];
            scoreBoard.textContent = score;

            birdY = gameCanvas.height / 2;
            targetBirdY = gameCanvas.height / 2;

            gameRunning = true;
            gameLoop();
        }

        function endGame() {
            gameRunning = false;
            inGameStopBtn.classList.add('hidden');
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('flappy_bombi_best', highScore.toString());
            }
            finalScore.textContent = score;
            if (bestScore) bestScore.textContent = highScore;
            gameOverScreen.classList.remove('hidden');
            resetDwell();
        }

        function quitToMenu() {
            gameRunning = false;
            gameOverScreen.classList.add('hidden');
            inGameStopBtn.classList.add('hidden');
            startScreen.classList.remove('hidden');
            cameraPreview.classList.add('active');

            score = 0;
            scoreBoard.textContent = '0';
            pipes = [];
            birdY = gameCanvas.height / 2;
            targetBirdY = gameCanvas.height / 2;

            resetDwell();
            drawEnvironment();
            setStatus("Kamera aktif! Arahkan telunjuk ke 'Mulai Game' atau klik untuk mulai.");
        }

        // --- Events ---
        startBtn.addEventListener('click', initializeSystem);
        restartBtn.addEventListener('click', startGame);
        quitBtn.addEventListener('click', quitToMenu);
        inGameStopBtn.addEventListener('click', endGame);

        // Gambar environment kosong sebagai background awal
        drawEnvironment();

    </script>
</body>
